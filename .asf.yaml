staging:
  profile: ~
  whoami:  asf-staging

publish:
  whoami: asf-site

github:
  description: "Source for the Apache OpenJPA web site"
  homepage: https://openjpa.apache.org/
  labels:
    - website
    - pelican
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
  del_branch_on_merge: true
