name: Build and Deploy Apache OpenJPA Documentation

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'theme/**'
      - 'scripts/**'
      - 'pelican.auto.py'
      - 'pelicanconf.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - '.asf.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm dependencies
        run: |
          npm install --ignore-scripts

      - name: Install Python dependencies
        run: |
          pip install pelican markdown
          pip install -r requirements.txt

      - name: Build static assets
        run: |
          node scripts/build-assets.js

      - name: Build documentation
        run: |
          pelican content -s pelican.auto.py

      - name: List build output
        run: |
          echo "=== Generated Files ==="
          ls -la output/
          ls -la output/css/ 2>/dev/null || true
          ls -la output/js/ 2>/dev/null || true

      - name: Check for critical files
        run: |
          test -f output/index.html || (echo "ERROR: index.html missing" && exit 1)
          echo "✓ Build validation passed"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          pip install pelican markdown
          pip install -r requirements.txt

      - name: Build static assets
        run: |
          node scripts/build-assets.js

      - name: Build documentation
        run: |
          pelican content -s pelican.auto.py

      - name: Deploy to asf-site
        uses: apache/infrastructure-actions/pelican@main
        with:
          destination: asf-site
          gfm: 'true'
          publish: true
