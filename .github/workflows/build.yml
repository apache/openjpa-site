name: Build and Deploy Apache OpenJPA Documentation

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'theme/**'
      - 'scripts/**'
      - 'pelican.auto.py'
      - 'pelicanconf.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - '.asf.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm dependencies
        run: |
          npm install --ignore-scripts

      - name: Install Python dependencies
        run: |
          pip install pelican markdown
          pip install -r requirements.txt

      - name: Build static assets
        run: |
          node scripts/build-assets.js

      - name: Build documentation
        run: |
          pelican content -s pelican.auto.py

      - name: List build output
        run: |
          echo "=== Generated Files ==="
          ls -la output/
          ls -la output/css/ 2>/dev/null || true
          ls -la output/js/ 2>/dev/null || true

      - name: Check for critical files
        run: |
          test -f output/index.html || (echo "ERROR: index.html missing" && exit 1)
          echo "✓ Build validation passed"

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: output/
          include-hidden-files: true
          retention-days: 1

  # Pushes the build to asf-site, which is served at https://openjpa.apache.org/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: output

      - name: Checkout asf-site
        uses: actions/checkout@v4
        with:
          ref: asf-site
          path: asf-site

      - name: Copy build to asf-site
        run: |
          rsync -a --delete output/ asf-site/output/

      - name: Commit and push
        working-directory: asf-site
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Publish ${GITHUB_SHA::8}"
            git push
          fi
