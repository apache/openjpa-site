site:
  name: Apache OpenJPA
  description: Apache OpenJPA is a Java persistence project at The Apache Software Foundation
  domain: openjpa.apache.org
  logo: images/openjpa-logo.png
  repository: https://github.com/apache/openjpa-site/blob/main/content/
  trademarks: Apache, the Apache feather logo, and "Project" are trademarks or registered trademarks

theme: theme/apache

# NOTE: The authoritative build configuration is pelican.auto.py, which is
# what the Makefile and the CI workflow invoke (`pelican content -s
# pelican.auto.py`). This YAML is kept as site metadata for the Apache
# pelican publishing tooling. The actual PLUGINS (asfgenid, asfcopy,
# asfsearch) and the ASF_GENID tuning live in pelican.auto.py.
plugins:
  paths:
    - theme/plugins
  use: []